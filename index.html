<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="styles.css?v=1.4">
    <title>HỌC TIẾNG TRUNG CÙNG CÔ HUYỀN</title>
</head>
<body>

    <!-- Header Thương hiệu -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
                <div class="brand-info">
                    <h1 class="center-name">TIẾNG TRUNG CÔ HUYỀN</h1>
                    <p class="slogan">Số hóa bài tập về nhà</p>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <!-- 1. Màn hình Chọn Cấp Độ HSK -->
        <section id="hsk-select-section" class="card-box">
            <h2 class="section-title">Chọn Trình Độ HSK</h2>
            <div class="hsk-grid">
                <button class="btn-hsk" onclick="selectHskLevel(1)">HSK 1</button>
                <button class="btn-hsk" onclick="selectHskLevel(2)">HSK 2</button>
                <button class="btn-hsk" onclick="selectHskLevel(3)">HSK 3</button>
                <button class="btn-hsk" onclick="selectHskLevel(4)">HSK 4</button>
                <button class="btn-hsk" onclick="selectHskLevel(5)">HSK 5</button>
                <button class="btn-hsk" onclick="selectHskLevel(6)">HSK 6</button>
            </div>
        </section>

        <!-- 2. Màn hình Chọn Bài Học -->
        <section id="menu-section" class="card-box" style="display:none;">
            <div class="card-header">
                <button class="btn-back" onclick="backToHskSelect()">⬅️ Chọn HSK</button>
                <h2 class="section-title" id="lesson-title" style="margin:0;">Danh Sách Bài Học</h2>
            </div>
            <div id="menu"></div>
        </section>

        <!-- 3. Màn hình Chọn Chế Độ -->
        <section id="mode-menu" class="card-box" style="display:none;">
            <div class="card-header">
                <button class="btn-back" onclick="backToLessonMenu()">⬅️ Chọn bài</button>
                <h3>Chọn Chế Độ Học</h3>
            </div>
            <div class="mode-grid">
                <button class="btn-mode" onclick="setMode('listen')">🎧 Luyện nghe</button>
                <button class="btn-mode" onclick="setMode('dictation')">✍️ Chép chính tả</button>
                <button class="btn-mode" onclick="setMode('look')">👁️ Học từ vựng</button>
                <button class="btn-mode btn-orange" onclick="startArrangeGame()">🧩 Sắp xếp câu</button>
            </div>
        </section>

        <!-- 4. Khung chơi game chính -->
        <section id="game-container" class="card-box" style="display:none;">
            <div class="card-header">
                <button class="btn-back" onclick="backToMenu()">⬅️ Quay lại</button>
            </div>
            
            <div id="q-box">
                <h2 id="question" class="hidden-text"></h2>
                <button id="speaker-btn" onclick="speakQuestion()">🔊</button>
            </div>
            
            <div id="options"></div> 
            
            <div id="dictation-box" style="display:none;">
                <input type="text" id="answer-input" placeholder="Nhập từ bạn nghe được..." autocomplete="off">
                <button class="btn-primary" onclick="checkDictation()">Kiểm tra</button>
            </div>
        </section>

        <!-- 5. Khung game Sắp xếp câu -->
        <section id="arrange-container" class="card-box" style="display: none;">
            <div class="card-header">
                <button class="btn-back" onclick="backToMenu()">⬅️ Quay lại</button>
            </div>
            <h2 id="arrange-question"></h2>
            <div id="word-pool"></div>
            <div id="drop-zone"></div>
            <button class="btn-primary" onclick="checkArrange()">Kiểm tra</button>
        </section>
    </main>

    <!-- Modal Kết quả -->
    <div id="resultModal" class="modal">
        <div class="modal-content card-box">
            <div class="modal-icon">🎉</div>
            <h2>Hoàn Thành!</h2>
            <p id="resultText"></p>
            <button class="btn-primary" onclick="backToModeMenu()">Quay lại</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
