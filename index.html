<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="styles.css?v=1.3">
    <title>Học tiếng Trung cùng cô Huyền</title>
</head>
<body>

    <!-- Header Thương hiệu & Logo Trung tâm -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
                <div class="brand-info">
                    <h1 class="center-name">TIẾNG TRUNG CÔ HUYỀN</h1>
                    <p class="slogan">Số hóa bài tập về nhà</p>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <!-- 1. Menu chọn bài -->
        <section id="menu-section" class="card-box">
            <h2 class="section-title">Danh sách bài tập HSK1</h2>
            <div id="menu">
                <button class="btn-lesson" onclick="startLesson(1)">Bài 1</button>
                <button class="btn-lesson" onclick="startLesson(2)">Bài 2</button>
                <button class="btn-lesson" onclick="startLesson(3)">Bài 3</button>
                <button class="btn-lesson" onclick="startLesson(4)">Bài 4</button>
                <button class="btn-lesson" onclick="startLesson(5)">Bài 5</button>
                <button class="btn-lesson" onclick="startLesson(6)">Bài 6</button>
                <button class="btn-lesson" onclick="startLesson(7)">Bài 7</button>
                <button class="btn-lesson" onclick="startLesson(8)">Bài 8</button>
                <button class="btn-lesson" onclick="startLesson(9)">Bài 9</button>
                <button class="btn-lesson" onclick="startLesson(10)">Bài 10</button>
                <button class="btn-lesson" onclick="startLesson(11)">Bài 11</button>
                <button class="btn-lesson" onclick="startLesson(12)">Bài 12</button>
                <button class="btn-lesson" onclick="startLesson(13)">Bài 13</button>
                <button class="btn-lesson" onclick="startLesson(14)">Bài 14</button>
                <button class="btn-lesson" onclick="startLesson(15)">Bài 15</button>
            </div>
        </section>

        <!-- 2. Menu chọn chế độ (Bấm quay lại sẽ về Chọn Bài) -->
        <section id="mode-menu" class="card-box" style="display:none;">
            <div class="card-header">
                <button class="btn-back" onclick="backToMenu()">⬅️ Chọn bài</button>
                <h3>Chọn Chế Độ Học</h3>
            </div>
            <div class="mode-grid">
                <button class="btn-mode" onclick="setMode('listen')">🎧 Luyện nghe</button>
                <button class="btn-mode" onclick="setMode('dictation')">✍️ Chép chính tả</button>
                <button class="btn-mode" onclick="setMode('look')">👁️ Học từ vựng</button>
                <button class="btn-mode btn-orange" onclick="startArrangeGame()">🧩 Sắp xếp câu</button>
            </div>
        </section>

        <!-- 3. Khung chơi game chính -->
        <section id="game-container" class="card-box" style="display:none;">
            <div class="card-header">
                <button class="btn-back" onclick="backToMenu()">⬅️ Quay lại</button>
            </div>
            
            <div id="q-box">
                <h2 id="question" class="hidden-text"></h2>
                <button id="speaker-btn" onclick="speakQuestion()">🔊</button>
            </div>
            
            <div id="options"></div> 
            
            <div id="dictation-box" style="display:none;">
                <input type="text" id="answer-input" placeholder="Nhập từ bạn nghe được..." autocomplete="off">
                <button class="btn-primary" onclick="checkDictation()">Kiểm tra</button>
            </div>
        </section>

        <!-- 4. Khung game Sắp xếp câu -->
        <section id="arrange-container" class="card-box" style="display: none;">
            <div class="card-header">
                <button class="btn-back" onclick="backToMenu()">⬅️ Quay lại</button>
            </div>
            <h2 id="arrange-question"></h2>
            <div id="word-pool"></div>
            <div id="drop-zone"></div>
            <button class="btn-primary" onclick="checkArrange()">Kiểm tra</button>
        </section>
    </main>

    <!-- 5. Pop-up Kết quả -->
    <div id="resultModal" class="modal">
        <div class="modal-content card-box">
            <div class="modal-icon">🎉</div>
            <h2>Hoàn Thành!</h2>
            <p id="resultText"></p>
            <button class="btn-primary" onclick="backToModeMenu()">Quay lại</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
